<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paysso Lucky Draw</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
            background: radial-gradient(circle at center, #30105c 0%, #12051f 45%, #050208 100%);
            color: white;
        }

        .game {
            width: 100%;
            max-width: 750px;
            text-align: center;
            padding: 30px 20px;
        }

        .title {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 3px;
            margin-bottom: 8px;
            color: white;
            text-shadow: 0 0 10px #ff00d4, 0 0 25px rgba(255, 0, 212, 0.6);
        }

        .subtitle {
            font-size: 15px;
            letter-spacing: 4px;
            color: #cccccc;
            margin-bottom: 30px;
        }

        .wheel-container {
            position: relative;
            width: min(600px, 90vw);
            height: min(600px, 90vw);
            margin: 0 auto 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.7)) drop-shadow(0 0 25px rgba(255, 0, 212, 0.35));
        }

        .pointer {
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 25px solid transparent;
            border-right: 25px solid transparent;
            border-top: 50px solid white;
            z-index: 10;
            filter: drop-shadow(0 0 5px white) drop-shadow(0 0 12px #ff00d4);
        }

        .spin-button {
            position: absolute;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            cursor: pointer;
            background: radial-gradient(circle, #333333, #080808);
            border: 7px solid white;
            color: white;
            font-size: 23px;
            font-weight: 900;
            letter-spacing: 2px;
            box-shadow: 0 0 0 6px rgba(255, 0, 212, 0.35),
                0 0 25px rgba(255, 0, 212, 0.8);
            transition: 0.2s;
        }

        .spin-button:hover {
            transform: scale(1.08);
            box-shadow: 0 0 0 8px rgba(255, 0, 212, 0.4),
                0 0 40px rgba(255, 0, 212, 1);
        }

        .spin-button:active {
            transform: scale(0.95);
        }

        .spin-button.disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .result {
            margin: 10px auto 0;
            padding: 20px 30px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.4);
            max-width: 550px;
            transition: 0.3s;
        }

        .result-title {
            font-size: 14px;
            letter-spacing: 3px;
            color: #aaaaaa;
            margin-bottom: 8px;
        }

        .result-value {
            font-size: 30px;
            font-weight: 900;
            color: white;
            min-height: 36px;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
        }

        .result.free-spin {
            animation: freeSpinWin 1.2s ease;
            border-color: #00e5ff;
            box-shadow: 0 0 20px #00e5ff,
                0 0 45px rgba(0, 229, 255, 0.5);
        }

        .result.surprise {
            animation: surpriseWin 1.2s ease;
            border-color: #ffd700;
            box-shadow: 0 0 20px #ffd700,
                0 0 45px rgba(255, 215, 0, 0.5);
        }

        .result.thank-you {
            animation: thankYouWin 0.8s ease;
        }

        @keyframes freeSpinWin {
            0% {
                transform: scale(0.7);
                opacity: 0;
            }

            50% {
                transform: scale(1.08);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes surpriseWin {
            0% {
                transform: rotate(-3deg) scale(0.7);
                opacity: 0;
            }

            25% {
                transform: rotate(3deg) scale(1.08);
            }

            50% {
                transform: rotate(-3deg) scale(1.05);
            }

            75% {
                transform: rotate(3deg) scale(1.02);
            }

            100% {
                transform: rotate(0) scale(1);
                opacity: 1;
            }
        }

        @keyframes thankYouWin {
            0% {
                transform: scale(0.9);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @media (max-width: 600px) {
            .game {
                padding: 20px 10px;
            }

            .title {
                font-size: 30px;
            }

            .subtitle {
                font-size: 11px;
                letter-spacing: 2px;
            }

            .spin-button {
                width: 100px;
                height: 100px;
                font-size: 18px;
                border-width: 5px;
            }

            .pointer {
                border-left-width: 18px;
                border-right-width: 18px;
                border-top-width: 38px;
            }

            .result-value {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <div class="game">

        <h1 class="title">PAYSSO LUCKY DRAW</h1>

        <p class="subtitle">SPIN THE WHEEL • TEST YOUR LUCK</p>

        <div class="wheel-container">

            <div class="pointer"></div>

            <canvas id="wheel" width="600" height="600"></canvas>

            <div class="spin-button" id="spinButton">
                SPIN
            </div>

        </div>

        <div class="result" id="resultBox">

            <div class="result-title">
                WHAT DID YOU WIN?
            </div>

            <div class="result-value" id="result">
                SPIN THE WHEEL!
            </div>

        </div>

    </div>

    <script>
        const canvas = document.getElementById("wheel");
        const ctx = canvas.getContext("2d");

        const spinButton = document.getElementById("spinButton");
        const resultBox = document.getElementById("resultBox");
        const result = document.getElementById("result");

        const center = canvas.width / 2;
        const radius = 285;

        const prizes = [
            {
                name: "FREE SPIN",
                emoji: "🎁",
                probability: 40
            },
            {
                name: "SURPRISE BOX",
                emoji: "🎉",
                probability: 10
            },
            {
                name: "THANK YOU",
                emoji: "🙏",
                probability: 40
            },
            {
                name: "ETHIO TELECOM PACKAGE",
                emoji: "📱",
                probability: 5
            },
            {
                name: "THANK YOU",
                emoji: "🙏",
                probability: 5
            }
        ];

        const colors = [
            "#00cfff",
            "#ff3cac",
            "#ff9f1c",
            "#19c463",
            "#7b2cff"
        ];

        const sectionAngle = (Math.PI * 2) / prizes.length;

        let rotation = 0;
        let spinning = false;

        function drawWheel() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();

            ctx.translate(center, center);
            ctx.rotate(rotation);

            for (let i = 0; i < prizes.length; i++) {
                const startAngle = -Math.PI / 2 + i * sectionAngle;
                const endAngle = startAngle + sectionAngle;

                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, radius, startAngle, endAngle);
                ctx.closePath();

                ctx.fillStyle = colors[i];
                ctx.fill();

                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 5;
                ctx.stroke();

                const middleAngle = startAngle + sectionAngle / 2;
                const textRadius = radius * 0.63;

                const textX = Math.cos(middleAngle) * textRadius;
                const textY = Math.sin(middleAngle) * textRadius;

                ctx.save();

                ctx.translate(textX, textY);

                let textRotation = middleAngle + Math.PI / 2;

                if (
                    textRotation > Math.PI / 2 &&
                    textRotation < Math.PI * 1.5
                ) {
                    textRotation += Math.PI;
                }

                ctx.rotate(textRotation);

                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                ctx.font = "40px Arial";

                ctx.fillText(
                    prizes[i].emoji,
                    0,
                    -25
                );

                ctx.fillStyle = "#ffffff";

                if (prizes[i].name === "ETHIO TELECOM PACKAGE") {
                    ctx.font = "bold 14px Arial";

                    ctx.fillText(
                        "ETHIO TELECOM",
                        0,
                        8
                    );

                    ctx.fillText(
                        "PACKAGE",
                        0,
                        29
                    );
                } else {
                    const words = prizes[i].name.split(" ");

                    ctx.font = "bold 18px Arial";

                    if (words.length === 2) {
                        ctx.fillText(
                            words[0],
                            0,
                            8
                        );

                        ctx.fillText(
                            words[1],
                            0,
                            30
                        );
                    } else {
                        ctx.fillText(
                            prizes[i].name,
                            0,
                            10
                        );
                    }
                }

                ctx.restore();
            }

            ctx.beginPath();

            ctx.arc(
                0,
                0,
                radius,
                0,
                Math.PI * 2
            );

            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 10;
            ctx.stroke();

            ctx.beginPath();

            ctx.arc(
                0,
                0,
                70,
                0,
                Math.PI * 2
            );

            ctx.fillStyle = "#080808";
            ctx.fill();

            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 4;
            ctx.stroke();

            ctx.restore();
        }

        function choosePrize() {
            const random = Math.random() * 100;

            let total = 0;

            for (let i = 0; i < prizes.length; i++) {
                total += prizes[i].probability;

                if (random < total) {
                    return i;
                }
            }

            return prizes.length - 1;
        }

        function showResult(prize) {
            resultBox.classList.remove(
                "free-spin",
                "surprise",
                "thank-you"
            );

            void resultBox.offsetWidth;

            result.textContent =
                `${prize.emoji} ${prize.name}`;

            if (prize.name === "FREE SPIN") {
                resultBox.classList.add("free-spin");
            } else if (prize.name === "SURPRISE BOX") {
                resultBox.classList.add("surprise");
            } else {
                resultBox.classList.add("thank-you");
            }
        }

        function spin() {
            if (spinning) {
                return;
            }

            spinning = true;

            spinButton.classList.add("disabled");

            resultBox.classList.remove(
                "free-spin",
                "surprise",
                "thank-you"
            );

            result.textContent = "SPINNING...";

            const selectedIndex = choosePrize();
            const selectedPrize = prizes[selectedIndex];

            const prizeAngle =
                -Math.PI / 2 +
                selectedIndex * sectionAngle +
                sectionAngle / 2;

            const pointerAngle = -Math.PI / 2;

            let targetRotation =
                pointerAngle -
                prizeAngle -
                rotation;

            targetRotation =
                (
                    targetRotation %
                    (Math.PI * 2) +
                    Math.PI * 2
                ) %
                (Math.PI * 2);

            const fullSpins =
                6 +
                Math.floor(Math.random() * 3);

            targetRotation +=
                fullSpins * Math.PI * 2;

            const startRotation = rotation;
            const finalRotation =
                startRotation + targetRotation;

            const duration = 5000;
            const startTime = performance.now();

            function animate(time) {
                const elapsed =
                    time - startTime;

                const progress =
                    Math.min(
                        elapsed / duration,
                        1
                    );

                const eased =
                    1 -
                    Math.pow(
                        1 - progress,
                        5
                    );

                rotation =
                    startRotation +
                    targetRotation * eased;

                drawWheel();

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    rotation = finalRotation;

                    drawWheel();

                    showResult(selectedPrize);

                    spinning = false;

                    spinButton.classList.remove(
                        "disabled"
                    );
                }
            }

            requestAnimationFrame(animate);
        }

        spinButton.addEventListener(
            "click",
            spin
        );

        drawWheel();
    </script>

</body>

</html>
